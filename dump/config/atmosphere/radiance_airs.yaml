bufr:
  variables:
    # MetaData
    timestamp:
      datetime:
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"
        second: "*/SECO"

    latitude:
      query: "*/CLATH"

    longitude:
      query: "*/CLONH"

    satelliteId:
      query: "*/SAID"

    sensorId:
      query: "*/SIID"

    scanLineNumber:
      query: "*/SLNM"

    fieldOfViewNumber:
      query: "*/FOVN"

    sensorScanPosition:
      query: "*/FOVN"

    solarZenithAngle:
      query: "*/SOZA"

    solarAzimuthAngle:
      query: "*/SOLAZI"

    sensorZenithAngle:
      query: "*/SAZA"

    sensorAzimuthAngle:
      query: "*/BEARAZ"

    sensorViewAngle:
      sensorScanAngle:
        fieldOfViewNumber: "*/FOVN"
        scanStart: -48.900
        scanStep: 1.100
        sensor: airs

    cloudCoverTotal:
      query: "*/TOCC"
      type: float
      transforms:
        - scale: 1.00

    sensorChannelNumber:
      query: "*/SCBTSEQN/CHNM"

    # ObsValue
    brightnessTemperature:
      query: "*/SCBTSEQN/TMBR"
      transforms:
        - scale: 1.00

    ChannelQualityFlag:
      query: "*/SCBTSEQN/ACQF"

encoder:

  dimensions:
    - name: Channel
      source: variables/sensorChannelNumber
      path: "*/SCBTSEQN"

  globals:
    - name: "platformCommonName"
      type: string
      value: "NASA EOS"

    - name: "platformLongDescription"
      type: string
      value: "Aqua from NASA's Earth Observing System (EOS) in a polar sun-synchronous orbit"

    - name: "source"
      type: string
      value: "AIRS 1C RADIANCES (VARIABLE CHNS) (AQUA)"

    - name: "datetimeReference"
      type: string
      value: "2002-05-04T00:00:00Z"

    - name: "sensor"
      type: string
      value: "AIRS"

    - name: "processingLevel"
      type: string
      value: "Level-1C"

    - name: "converter"
      type: string
      value: "BUFR"

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      longName: "Latitude"
      units: "degrees_north"
      range: [ -90, 90 ]

    - name: "MetaData/longitude"
      source: variables/longitude
      longName: "Longitude"
      units: "degrees_east"
      range: [ -180, 180 ]

    - name: "MetaData/satelliteIdentifier"
      source: variables/satelliteId
      longName: "Satellite Identifier"

    - name: "MetaData/instrumentIdentifier"
      source: variables/sensorId
      longName: "Satellite Instrument Identifier"

    - name: "MetaData/scanLineNumber"
      source: variables/scanLineNumber
      longName: "Scan Line Number"

    - name: "MetaData/ChannelQualityFlag"
      source: variables/ChannelQualityFlag
      longName: "Channel quality flags for ATOVS"
      units: "1"

    - name: "MetaData/fieldOfViewNumber"
      source: variables/fieldOfViewNumber
      longName: "Field of View Number"

    - name: "MetaData/sensorScanPosition"
      source: variables/sensorScanPosition
      longName: "Sensor Scan Position"

    - name: "MetaData/solarZenithAngle"
      source: variables/solarZenithAngle
      longName: "Solar Zenith Angle"
      units: "degree"
      range: [ 0, 180 ]

    - name: "MetaData/solarAzimuthAngle"
      source: variables/solarAzimuthAngle
      longName: "Solar Azimuth Angle"
      units: "degree"
      range: [ 0, 360 ]

    - name: "MetaData/sensorZenithAngle"
      source: variables/sensorZenithAngle
      longName: "Sensor Zenith Angle"
      units: "degree"
      range: [ 0, 90 ]

    - name: "MetaData/sensorAzimuthAngle"
      source: variables/sensorAzimuthAngle
      longName: "Sensor Azimuth Angle"
      units: "degree"
      range: [ 0, 360 ]

    - name: "MetaData/sensorViewAngle"
      source: variables/sensorViewAngle
      longName: "Sensor View Angle"
      units: "degree"

    - name: "MetaData/sensorChannelNumber"
      source: variables/sensorChannelNumber
      longName: "Sensor Channel Number"

    - name: "MetaData/cloudCoverTotal"
      source: variables/cloudCoverTotal
      longName: "Total Cloud Cover"
      units: "1"
      range: [ 0, 100 ]

    - name: "ObsValue/brightnessTemperature"
      source: variables/brightnessTemperature
      longName: "AIRS brightness Temperature"
      units: "K"
